<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ComEd Interconnection Queue Data</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a2340; padding: 2rem; }
  .wrap { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 1.5rem; }
  h1 { color: #1a2340; font-size: 18px; margin-bottom: 4px; }
  .meta { color: #6b7a99; font-size: 12px; margin-bottom: 1rem; }
  input[type=text] { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid #e8ecf2; border-radius: 6px; margin-bottom: 1rem; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e8ecf2; white-space: nowrap; }
  th { background: #1a2340; color: #fff; cursor: pointer; position: sticky; top: 0; }
  tr:hover { background: #f7f9fc; }
  .table-wrap { max-height: 75vh; overflow: auto; border: 1px solid #e8ecf2; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ComEd Interconnection Queue</h1>
  <div class="meta" id="meta">Loading…</div>
  <input type="text" id="search" placeholder="Search…" />
  <div class="table-wrap">
    <table id="dataTable">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</div>

<script>
  let rows = [];
  let columns = [];
  let sortCol = null;
  let sortAsc = true;

  fetch('data/comed_queue_data.json')
    .then(r => r.json())
    .then(json => {
      columns = json.columns;
      rows = json.data;
      document.getElementById('meta').textContent =
        `${json.total_records} records · scraped ${new Date(json.scraped_at).toLocaleString()}`;
      renderHeader();
      render(rows);
    })
    .catch(e => {
      document.getElementById('meta').textContent = 'Could not load data: ' + e.message;
    });

  function renderHeader() {
    const headerRow = document.getElementById('headerRow');
    headerRow.innerHTML = '';
    columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col;
      th.onclick = () => {
        sortAsc = sortCol === col ? !sortAsc : true;
        sortCol = col;
        render(currentFiltered());
      };
      headerRow.appendChild(th);
    });
  }

  function currentFiltered() {
    const q = document.getElementById('search').value.toLowerCase();
    return rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }

  function render(data) {
    if (sortCol) {
      data = [...data].sort((a, b) => {
        const av = a[sortCol], bv = b[sortCol];
        const an = parseFloat(av), bn = parseFloat(bv);
        const cmp = (!isNaN(an) && !isNaN(bn)) ? an - bn : String(av).localeCompare(String(bv));
        return sortAsc ? cmp : -cmp;
      });
    }
    const body = document.getElementById('bodyRows');
    body.innerHTML = '';
    data.forEach(r => {
      const tr = document.createElement('tr');
      columns.forEach(col => {
        const td = document.createElement('td');
        td.textContent = r[col] ?? '';
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  document.getElementById('search').addEventListener('input', () => render(currentFiltered()));
</script>
</body>
</html>

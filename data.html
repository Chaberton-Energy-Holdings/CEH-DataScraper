<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ComEd Interconnection Queue Data</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a2340; padding: 2rem; }
  .wrap { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 1.5rem; }
  h1 { color: #1a2340; font-size: 18px; margin-bottom: 4px; }
  .meta { color: #6b7a99; font-size: 12px; margin-bottom: 1rem; }
  input[type=text] { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid #e8ecf2; border-radius: 6px; margin-bottom: 1rem; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e8ecf2; white-space: nowrap; }
  thead tr:first-child th {
   position: sticky;
   top: 0;
   z-index: 2;
   background: #1a2340;
   color: #fff;
   cursor: pointer;
   height: 36px;
  }
  thead tr:last-child th {
   position: sticky;
   top: 36px;
   z-index: 1;
   background: #fff;
   padding: 4px 8px;
  }
  tr:hover { background: #f7f9fc; }
  .table-wrap { max-height: 75vh; overflow: auto; border: 1px solid #e8ecf2; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ComEd Interconnection Queue</h1>
  <div class="meta" id="meta">Loading…</div>
  <div style="display:flex; gap:8px; margin-bottom:1rem; flex-wrap:wrap;">
    <input type="text" id="search" placeholder="Search all columns…" style="flex:1; min-width:200px; padding: 8px 12px; border: 1px solid #e8ecf2; border-radius: 6px; font-size: 13px;" />
    <button onclick="exportToExcel()" style="padding:8px 14px; font-size:12px; border:1px solid #e8ecf2; border-radius:6px; background:#1a2340; color:#fff; cursor:pointer;">⬇ Export to Excel</button>
    <button onclick="location.reload()" style="padding:8px 14px; font-size:12px; border:1px solid #e8ecf2; border-radius:6px; background:#fff; cursor:pointer;">↻ Reload</button>
  </div>
  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr id="headerRow"></tr>
        <tr id="filterRow"></tr>
      </thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  let rows = [];
  let columns = [];
  let sortCol = null;
  let sortAsc = true;
  let columnFilters = {};

  fetch('data/comed_queue_data.json?t=' + Date.now())
    .then(r => r.json())
    .then(json => {
      columns = json.columns;
      rows = json.data;
      document.getElementById('meta').textContent =
        `${json.total_records} records · scraped ${new Date(json.scraped_at).toLocaleString()}`;
      renderHeader();
      render(currentFiltered());
    })
    .catch(e => {
      document.getElementById('meta').textContent = 'Could not load data: ' + e.message;
    });

  function renderHeader() {
    const headerRow = document.getElementById('headerRow');
    const filterRow = document.getElementById('filterRow');
    headerRow.innerHTML = '';
    filterRow.innerHTML = '';

    columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col + (sortCol === col ? (sortAsc ? ' ▲' : ' ▼') : '');
      th.onclick = () => {
        sortAsc = sortCol === col ? !sortAsc : true;
        sortCol = col;
        renderHeader();
        render(currentFiltered());
      };
      headerRow.appendChild(th);

      const filterTh = document.createElement('th');
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Filter…';
      input.style.cssText = 'width:100%; padding:4px 6px; font-size:12px; border:1px solid #e8ecf2; border-radius:4px;';
      input.value = columnFilters[col] || '';
      input.oninput = () => {
        columnFilters[col] = input.value;
        render(currentFiltered());
      };
      filterTh.appendChild(input);
      filterRow.appendChild(filterTh);
    });
  }

  function currentFiltered() {
    const q = document.getElementById('search').value.toLowerCase();
    return rows.filter(r => {
      const matchesSearch = Object.values(r).some(v => String(v).toLowerCase().includes(q));
      const matchesColumns = Object.entries(columnFilters).every(([col, val]) =>
        !val || String(r[col] ?? '').toLowerCase().includes(val.toLowerCase())
      );
      return matchesSearch && matchesColumns;
    });
  }

  function render(data) {
    if (sortCol) {
      data = [...data].sort((a, b) => {
        const av = a[sortCol], bv = b[sortCol];
        const an = parseFloat(av), bn = parseFloat(bv);
        const cmp = (!isNaN(an) && !isNaN(bn)) ? an - bn : String(av).localeCompare(String(bv));
        return sortAsc ? cmp : -cmp;
      });
    }
    const body = document.getElementById('bodyRows');
    body.innerHTML = '';
    data.forEach(r => {
      const tr = document.createElement('tr');
      columns.forEach(col => {
        const td = document.createElement('td');
        td.textContent = r[col] ?? '';
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  function exportToExcel() {
    const data = currentFiltered();
    const ws = XLSX.utils.json_to_sheet(data, { header: columns });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ComEd Queue');
    XLSX.writeFile(wb, 'comed_queue_' + new Date().toISOString().slice(0,10) + '.xlsx');
  }

  document.getElementById('search').addEventListener('input', () => render(currentFiltered()));
</script>
</body>
</html>

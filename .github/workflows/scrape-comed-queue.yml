name: Scrape ComEd Queue

on:
  repository_dispatch:
    types: [scrape-comed-queue]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run scraper
        run: python comed_queue_scraper.py --output comed_queue_data.json
      - name: POST results to n8n
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data-binary @comed_queue_data.json